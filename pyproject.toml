[project]
name = "asciigen"
version = "0.1.0"
description = "A rather dead simple ASCII art image generator."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pillow>=12.0.0", "pyfiglet>=1.0.4", "typer>=0.20.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
# Creates the 'asciigen' command
asciigen = "main:app"
